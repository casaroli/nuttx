name: msys2-hang-repro
on:
  push:
    branches:
      - msys2-hang-repro
jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          cache: false
          install: >-
            base-devel
            gcc
            gperf
            automake
            autoconf
            git
            python3
            ncurses-devel
            unzip
            zip
            tio
            zlib-devel
            cmake
            ninja
            python-pip
            vim
            genromfs
            gdb

      - name: pip3 install
        run: |
          python3 -m venv --system-site-packages /usr/local
          pip3 install --root-user-action=ignore --no-cache-dir pyelftools cxxfilt kconfiglib

      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          repository: apache/nuttx
          path: sources/nuttx
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: apache/nuttx-apps
          path: sources/apps
          fetch-depth: 1

      - name: Versions
        run: |
          uname -a; cmake --version | head -1; ninja --version
          python3 --version; pacman -Q msys2-runtime cmake python
          command -v setconfig olddefconfig

      - name: Configure in a loop
        run: |
          cd sources/nuttx
          hangs=0
          for i in $(seq 1 80); do
            rm -rf build
            start=$(date +%s)
            cmake -B build -DBOARD_CONFIG=nucleo-l152re/nsh -DNXTMPDIR=OFF -GNinja > /tmp/cfg.out 2> /tmp/cfg.err &
            pid=$!
            while kill -0 $pid 2> /dev/null && [ $(($(date +%s) - start)) -lt 240 ]; do
              sleep 2
            done
            if kill -0 $pid 2> /dev/null; then
              hangs=$((hangs + 1))
              echo "::group::HANG $hangs in iteration $i: cmake pid $pid, winpid $(cat /proc/$pid/winpid)"
              echo "--- last output"; tail -5 /tmp/cfg.out; tail -5 /tmp/cfg.err
              echo "--- ps"; ps -ef
              echo "--- fds"; ls -l /proc/$pid/fd
              echo "--- status"; cat /proc/$pid/status
              echo "--- gdb"
              gdb -batch -nx -ex "set pagination off" -ex "info threads" -ex "thread apply all bt" -p $pid 2>&1 | head -300
              echo "::endgroup::"
              kill -9 $pid
              if [ $hangs -ge 3 ]; then
                break
              fi
            else
              wait $pid
              ret=$?
              echo "iteration $i: exit $ret after $(($(date +%s) - start)) s: $(grep -a -o -m1 'TOOLS_DIR path is.*\|CMake Error at [^ ]*' /tmp/cfg.out /tmp/cfg.err | head -1)"
            fi
          done
          echo "hangs: $hangs"
