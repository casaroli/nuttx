name: msys2-hang-repro
on:
  workflow_dispatch:
  push:
    branches:
      - msys2-hang-repro
jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        mode: [configure, configure2, configure-trace]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          cache: false
          install: >-
            base-devel
            gcc
            gperf
            automake
            autoconf
            git
            python3
            ncurses-devel
            unzip
            zip
            tio
            zlib-devel
            cmake
            ninja
            python-pip
            vim
            genromfs
            gdb

      - name: pip3 install
        run: |
          python3 -m venv --system-site-packages /usr/local
          pip3 install --root-user-action=ignore --no-cache-dir pyelftools cxxfilt kconfiglib

      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          repository: apache/nuttx
          path: sources/nuttx
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: apache/nuttx-apps
          path: sources/apps
          fetch-depth: 1

      - name: Sysinternals Handle
        run: |
          curl -sSL -o /tmp/Handle.zip https://download.sysinternals.com/files/Handle.zip
          mkdir -p /tmp/handle && unzip -o -q /tmp/Handle.zip -d /tmp/handle
          /tmp/handle/handle64.exe -accepteula -nobanner -p bash | head -5

      - name: Versions
        run: |
          uname -a; cmake --version | head -1; ninja --version
          python3 --version; pacman -Q msys2-runtime cmake python
          command -v setconfig olddefconfig

      - name: Repeat until it hangs
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set +e
          cd sources/nuttx
          cp boards/arm/stm32l1/nucleo-l152re/configs/nsh/defconfig /tmp/kconfig.cfg
          cat > /tmp/one.cmake <<'EOS'
          if(MODE STREQUAL "echo")
            execute_process(COMMAND python3 -c "print('x' * 100)"
                            OUTPUT_VARIABLE o ERROR_VARIABLE e RESULT_VARIABLE r)
          else()
            set(ENV{KCONFIG_CONFIG} /tmp/kconfig.cfg)
            execute_process(COMMAND setconfig HOST_WINDOWS=y WINDOWS_MSYS=y
                                    --kconfig ${CMAKE_CURRENT_LIST_DIR}/Kconfig
                            OUTPUT_VARIABLE o ERROR_VARIABLE e RESULT_VARIABLE r
                            WORKING_DIRECTORY ${NUTTX})
          endif()
          message("r=${r}")
          EOS
          sed -i 's/^          //' /tmp/one.cmake
          cp /tmp/one.cmake ./one.cmake
          case $MODE in configure*) limit=600 ;; *) limit=120 ;; esac
          export DEBUGINFOD_URLS=https://debuginfod.msys2.org
          H=/tmp/handle/handle64.exe
          hangs=0; n=0; t0=$(date +%s)
          while [ $(($(date +%s) - t0)) -lt 6000 ]; do
            n=$((n + 1))
            start=$(date +%s)
            if [ $MODE = configure-trace ]; then
              rm -rf build /tmp/trace.json
              cmake -B build -DBOARD_CONFIG=nucleo-l152re/nsh -DNXTMPDIR=OFF -GNinja --trace-expand --trace-format=json-v1 --trace-redirect=/tmp/trace.json > /tmp/out 2> /tmp/err &
            elif [ ${MODE%[23]} = configure ]; then
              rm -rf build
              cmake -B build -DBOARD_CONFIG=nucleo-l152re/nsh -DNXTMPDIR=OFF -GNinja > /tmp/out 2> /tmp/err &
            else
              cmake -DMODE=${MODE%2} -DNUTTX=$PWD -P one.cmake > /tmp/out 2> /tmp/err &
            fi
            pid=$!
            while kill -0 $pid 2> /dev/null && [ $(($(date +%s) - start)) -lt $limit ]; do
              sleep 1
            done
            if kill -0 $pid 2> /dev/null; then
              hangs=$((hangs + 1))
              echo "::group::HANG $hangs in iteration $n: cmake pid $pid, winpid $(cat /proc/$pid/winpid)"
              echo "--- last output"; tail -5 /tmp/out; tail -5 /tmp/err
              winpid=$(cat /proc/$pid/winpid)
              echo "--- ps"; ps -ef
              echo "--- ps -W (Windows processes too)"; ps -efW
              echo "--- fds"; ls -l /proc/$pid/fd
              echo "--- handles of cmake (winpid $winpid)"; $H -nobanner -a -p $winpid 2>&1
              echo "--- named pipes in all processes"; $H -nobanner -a -v 2>&1 | grep -i "namedpipe"
              if [ $MODE = configure-trace ]; then
                echo "--- last trace lines"; tail -5 /tmp/trace.json | cut -c1-600
              fi
              echo "--- gdb"
              gdb -batch -nx -ex "set pagination off" -ex "set debuginfod enabled on" -ex "info threads" -ex "thread apply all bt" -p $pid 2>&1 | head -400
              echo "::endgroup::"
              kill -9 $pid
              [ $hangs -ge 3 ] && break
            else
              wait $pid
              ret=$?
              if [ $((n % 25)) -eq 1 ] || [ ${MODE%%[-23]*} = configure ]; then
                echo "iteration $n: exit $ret after $(($(date +%s) - start)) s $(tail -1 /tmp/out | cut -c1-80)"
              fi
            fi
          done
          echo "mode $MODE: $n iterations, $hangs hangs"
